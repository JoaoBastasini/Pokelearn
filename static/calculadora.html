<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutorial e Anotações</title>
    <link rel="stylesheet" href="/static/css/calculadora_style.css" />
  </head>
  <body>
    <div class="pokedex">
      <!-- Lado esquerdo: Tutorial -->
      <div class="tutorial-panel">
        <div class="carousel-display" id="tutorial-display">
          <div class="panel-title-row">
            <h2>TUTORIAL</h2>
            <button
              class="fullscreen-btn"
              type="button"
              id="fullscreen-btn"
              aria-label="Abrir tutorial em tela cheia"
            >
              ⛶
            </button>
          </div>

          <div class="carousel">
            <button
              class="carousel-btn prev"
              type="button"
              aria-label="Imagem anterior"
            >
              ‹
            </button>
            <div class="carousel-track">
              <img id="carousel-image" src="" alt="" />
            </div>
            <button
              class="carousel-btn next"
              type="button"
              aria-label="Próxima imagem"
            >
              ›
            </button>
          </div>

          <div class="carousel-footer">
            <div class="carousel-dots" id="carousel-dots"></div>
            <span class="carousel-counter" id="carousel-counter"></span>
          </div>
        </div>
      </div>

      <!-- Dobradiça -->
      <div class="hinge">
        <div class="hinge-line"></div>
        <div class="hinge-line"></div>
        <div class="hinge-line"></div>
      </div>

      <!-- Lado direito: Anotações -->
      <div class="notes-panel">
        <div class="notes-display">
          <h2>ANOTAÇÕES</h2>

          <textarea
            id="notes"
            placeholder="Escreva suas anotações..."
          ></textarea>
        </div>
      </div>
    </div>

    <script>
      // Anotações
      (function () {
        const notes = document.getElementById("notes");
        notes.value = localStorage.getItem("pokedex_notes") || "";
        notes.addEventListener("input", () => {
          localStorage.setItem("pokedex_notes", notes.value);
        });
      })();

      // Carrossel de imagens do tutorial de matemática
      // Substitua pelos caminhos reais das imagens do tutorial
      (function () {
        const tutorialImages = [
          "/static/tutorial/Tutorial-Matematica-1.png",
          "/static/tutorial/Tutorial-Matematica-2.png",
          "/static/tutorial/Tutorial-Matematica-3.png",
        ];

        const image = document.getElementById("carousel-image");
        const dotsContainer = document.getElementById("carousel-dots");
        const counter = document.getElementById("carousel-counter");
        const prevBtn = document.querySelector(".carousel-btn.prev");
        const nextBtn = document.querySelector(".carousel-btn.next");

        let current = 0;

        function renderDots() {
          dotsContainer.innerHTML = "";
          tutorialImages.forEach((_, i) => {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.className = "dot" + (i === current ? " active" : "");
            dot.setAttribute("aria-label", `Ir para a imagem ${i + 1}`);
            dot.addEventListener("click", () => goToSlide(i));
            dotsContainer.appendChild(dot);
          });
        }

        function goToSlide(index) {
          current = (index + tutorialImages.length) % tutorialImages.length;
          image.src = tutorialImages[current];
          image.alt = `Passo ${current + 1} do tutorial de matemática`;
          counter.textContent = `${current + 1} / ${tutorialImages.length}`;
          renderDots();
        }

        prevBtn.addEventListener("click", () => goToSlide(current - 1));
        nextBtn.addEventListener("click", () => goToSlide(current + 1));

        window.addEventListener("keydown", (e) => {
          if (document.activeElement.tagName === "TEXTAREA") return;
          if (e.key === "ArrowLeft") goToSlide(current - 1);
          else if (e.key === "ArrowRight") goToSlide(current + 1);
        });

        goToSlide(0);
      })();

      // Botão de tela cheia do tutorial
      (function () {
        const display = document.getElementById("tutorial-display");
        const btn = document.getElementById("fullscreen-btn");

        function isFullscreen() {
          return (
            document.fullscreenElement === display ||
            document.webkitFullscreenElement === display
          );
        }

        function updateButton() {
          const active = isFullscreen();
          btn.textContent = active ? "✕" : "⛶";
          btn.setAttribute(
            "aria-label",
            active ? "Fechar tela cheia" : "Abrir tutorial em tela cheia",
          );
        }

        btn.addEventListener("click", () => {
          if (!isFullscreen()) {
            const request =
              display.requestFullscreen ||
              display.webkitRequestFullscreen ||
              display.msRequestFullscreen;
            if (request) {
              request.call(display).catch(() => {
                /* navegador pode bloquear tela cheia dentro de um iframe
                   sem o atributo "allowfullscreen" */
              });
            }
          } else {
            const exit =
              document.exitFullscreen ||
              document.webkitExitFullscreen ||
              document.msExitFullscreen;
            if (exit) exit.call(document);
          }
        });

        document.addEventListener("fullscreenchange", updateButton);
        document.addEventListener("webkitfullscreenchange", updateButton);
      })();
    </script>
  </body>
</html>
